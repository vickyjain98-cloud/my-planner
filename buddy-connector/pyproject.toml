[project]
name = "myplanner-connector"
version = "0.1.0"
description = "Buddy OS connector for My Planner: reads the planner feed from Google Drive, proposes suggestions through the approval inbox, and indexes daily summaries for Buddy's memory."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "google-auth>=2.29", "google-auth-oauthlib>=1.2", "pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
tools = ["langchain-core>=0.2"]
memory = ["chromadb>=0.5"]
secure = ["cryptography>=42"]
all = ["fastapi>=0.110", "langchain-core>=0.2", "chromadb>=0.5", "cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "langchain-core>=0.2"]

[project.scripts]
myplanner = "myplanner_connector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myplanner_connector"]
