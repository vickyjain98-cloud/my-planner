<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security: only this site, Google sign-in and Google APIs may run or be contacted. No analytics, ads or third-party scripts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5B765F">
<title>My Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="sage">
<div class="app">
  <nav class="side" id="side" aria-label="Main menu"></nav>
  <main class="main" id="main"><p style="padding:40px;text-align:center">Loading My Planner…</p></main>
</div>
<nav class="bottom" id="bottom" aria-label="Quick menu"></nav>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="in card stack"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>My Planner needs JavaScript turned on.</noscript>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/google.js"></script>
<script src="js/pad.js"></script>
<script src="js/app.js"></script>
</body>
</html>
